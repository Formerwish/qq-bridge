{% extends "base.html" %}
{% block title %}编辑黑话 · qq-bridge 控制台{% endblock %}
{% block content %}
<section class="panel">
  <h2>编辑黑话 <a class="btn btn-primary ms-auto" href="/slang">返回列表</a></h2>
  <form method="post" class="form wide">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>词条 <input class="form-control" name="content" value="{{ row.content or '' }}" maxlength="64" required></label>
    <label>含义 <input class="form-control" name="meaning" value="{{ row.meaning or '' }}" maxlength="255"></label>
    <label>用法 <input class="form-control" name="usage" value="{{ row.usage or '' }}" maxlength="255"></label>
    <label>示例 <input class="form-control" name="example" value="{{ row.example or '' }}" maxlength="255"></label>
    <label>风险/注意 <input class="form-control" name="risk" value="{{ row.risk or '' }}" maxlength="255"></label>
    <label>状态
      <select class="form-select" name="status">
        {% for s in statuses %}<option value="{{ s }}" {{ 'selected' if row.status == s else '' }}>{{ s }}</option>{% endfor %}
      </select>
    </label>
    <div class="row-actions">
      <button class="btn btn-primary" type="submit">保存</button>
      <a class="btn btn-outline-secondary" href="/slang">取消</a>
    </div>
  </form>
  {% if row.sources_json or row.evidence_json %}
  <h3>来源证据</h3>
  <pre class="logbox">{{ row.sources_json or '' }}{{ row.evidence_json or '' }}</pre>
  {% endif %}
</section>
{% endblock %}
