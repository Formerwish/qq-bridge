{% extends "base.html" %}
{% block title %}{{ '新建条目' if mode == 'new' else '编辑条目' }} · 知识库{% endblock %}
{% block content %}
<section class="panel">
  <h2>{{ '新建条目' if mode == 'new' else '编辑条目' }} <a class="btn btn-primary ms-auto" href="/kb">返回列表</a></h2>
  <form method="post" class="form wide">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>主题 <input class="form-control" name="topic" value="{{ entry.topic or '第五人格' }}" maxlength="32"></label>
    <label>标题 <input class="form-control" name="title" value="{{ entry.title or '' }}" maxlength="128" required></label>
    <label>关键词（逗号/顿号/空格分隔；命中即注入）
      <input class="form-control" name="keywords" value="{{ entry.keywords or '' }}" maxlength="255" required>
    </label>
    <label>正文（建议 100~600 字，命中时最多注入 2 条/800 字）
      <textarea class="form-control" name="body" rows="10" required>{{ entry.body or '' }}</textarea>
    </label>
    <label>优先级（同命中时大的先注入）
      <input class="form-control" name="priority" type="number" value="{{ entry.priority or 0 }}" min="-100" max="100">
    </label>
    <label class="row"><input type="checkbox" name="enabled" {{ 'checked' if entry.enabled else '' }}> 启用</label>
    <div class="row-actions">
      <button class="btn btn-primary" type="submit">保存</button>
      <a class="btn btn-outline-secondary" href="/kb">取消</a>
    </div>
  </form>
</section>
{% endblock %}
