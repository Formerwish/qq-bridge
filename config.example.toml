# qq-bridge 配置（TOML）
#
# 说明：
#   - 这是唯一权威配置文件；程序保存（如 token 自愈、控制台改设置）会重新序列化本文件，
#     手写注释可能丢失，重要说明请写进 docs 或 README。
#   - 桥接启动时读取；标了「热重载」的项可在控制台/管理员工具里改完即时生效。
#   - 各字段含义见 docs/DEPLOY.md。
sessionCwd = ""
agentPreset = "qq-chat-v2"
workspaceTitle = "QQ 聊天"
allowAllWhenEmpty = false
ackMessage = ""
sendDelayMs = 300
questionTimeoutMs = 300000
consoleUrl = "http://127.0.0.1:3100"
consoleAllowedHosts = []
consoleToken = ""

[dsh]
baseUrl = "http://127.0.0.1:3080"
provider = "deepseek-official"
model = "deepseek-flash"
reasoningEffort = "max"
authToken = ""
authHeader = "authorization"
authPrefix = "Bearer"
allowRemote = false

[role]
maxInjectChars = 6000

[snowluma]
wsUrl = "ws://127.0.0.1:3001"
httpUrl = "http://127.0.0.1:3000"
accessToken = ""
followDiscoveredEndpoint = true
silenceWarnMs = 600000
launcherPath = ""
homeDir = ""

[allow]
private = []
groups = []

[deny]
private = []
groups = []

[pricing.models.my-relay-model]
label = "我的中转模型"

[pricing.models.my-relay-model.off]
cacheHit = 0.5
cacheMiss = 3
output = 9

[security]
interceptNotify = true

[slang]
enabled = true
extractMinMessages = 10
extractCooldownMs = 300000
inferenceThresholds = [ 2, 4, 8 ]
injectMax = 8
learnerPreset = "qq-chat-v2"
workspaceTitle = "QQ 黑话学习"
autoResearch = true

[kb]
enabled = true
cacheTtlMs = 60000

[kb.mysql]
host = "127.0.0.1"
port = 10708
user = "qqkb_bridge"
password = ""
database = "qq_bridge_kb"
connectionLimit = 2
connectTimeoutMs = 3000

[kb.inject]
enabled = true
maxEntries = 2
maxChars = 800

[kb.query]
maxResults = 5
previewChars = 400
timeoutMs = 2500

[socialV2]
enabled = true
autoReplyCheckMs = 30000
agentPreset = "qq-chat-v2"
provideRecommendations = true
initialPromptMaxChars = 2000

[socialV2.tools]
getPrompt = true
getUnread = true
getRecent = true
socialState = true
sendGroup = true
sendPrivate = true
reply = true
sendBurst = true
sendMessage = true
waitMessages = true
feedback = true
getMyRecent = true
getMessageDetail = true
getActiveMembers = true
setWakeConfig = true
markRead = true
memory = true
slangQuery = true
slangSubmit = true
getImages = true
getForwardMsg = true
sendPoke = true
listStickers = true
getStickerImage = true
sendSticker = true
setStickerRemark = false
stickerNote = true
collectSticker = true
kbSearch = true
getSelfImage = true
sendVoice = false

[socialV2.wake]
defaultMode = "diving"
preSleepWaitEnabled = true
preSleepWaitMs = 300000
recommendedDefaultInfinite = true
sleepMinMs = 60000
sleepMaxMs = 0
recommendedSleepMinMs = 300000
recommendedSleepMaxMs = 7200000
recommendedProbability = 0.05
recommendedKeywords = [ "小鲸鱼", "DeepSeek", "deepseek", "DS", "D老师", "d老师", "D指导", "d指导", "D师傅", "d师傅", "深度求索", "大肥鱼", "鲸鱼", "DeepSeek V3", "DeepSeek R1", "R1" ]
recommendedAtMention = true
recommendedNameMention = true
recommendedQuestion = true
recommendedPoke = true
recommendedHint = "如果你要潜水，推荐先调用 qq_wait_for_messages(timeoutMs=300000) 完成一次沉睡前观察：5 分钟内没人说话就可以设置下一次唤醒并沉睡；若期间有人发新消息，先查看 newMessages，判断不需要你参与可直接沉睡，若参与了则下次想睡需再等观察窗口。潜水时长推荐 5~120 分钟，普通消息概率 0.05；@/名字/关键词/提问唤醒建议保持开启。需要等特定某人/某几人时，可额外设置 triggers.speakerIds。"
batchWindowMs = 8000
maxWakePerMinute = 1
maxWakePerHour = 12
noActionLimit = 3
maxWakeConfigReminders = 2

[socialV2.send]
burstEnabled = true
burstMaxMessages = 8
burstIntervalMinMs = 1000
burstIntervalMaxMs = 3000
longGapProbability = 0.2
longGapMinMs = 5000
longGapMaxMs = 10000
maxSendPerMinute = 8
maxSendPerHour = 60
maxMessageChars = 500
maxGapMs = 10000
gapBaseMs = 800
gapPerCharMs = 20
recommendedHint = "单条消息不要用空格断句，中文短句用逗号/顿号或直接连写；分条时每条都要读起来完整，不要把同一句话拆到两条里；普通闲聊建议一次 1~3 条，条间 1~3 秒；讲故事/回忆可以 5~10 秒间隔；不要连续刷屏。"

[socialV2.wait]
defaultMs = 30000
minMs = 5000
maxMs = 600000
defaultQuietMs = 8000
minQuietAfterNewMs = 10000

[socialV2.sticker]
enabled = true
syncTtlMs = 60000
maxListCount = 100
includeInPrompt = true
promptMaxStickers = 8

[socialV2.sticker.collect]
enabled = true
maxPerMinute = 2
maxPerHour = 10
maxRemarkChars = 20

[socialV2.voice]
enabled = false
dir = "audio"
maxSeconds = 300
maxBytes = 20971520
maxPerMinute = 2
maxPerHour = 10
allowAbsolutePath = false
defaultVolume = 1
loudness = "normal"
ffmpegPath = ""
autoReadback = true

[socialV2.proactive]
enabled = true
checkIntervalMinMs = 1800000
checkIntervalMaxMs = 5400000
idleThresholdMs = 900000
probability = 0.3

[socialV2.feedback]
maxLength = 500
notifyOwnerOnError = false

[socialV2.context]
recentLimit = 100
unreadLimit = 30
contextWindow = 20
inlineWakeMessages = true
wakeMessageLimit = 12
wakeRecentLimit = 4
wakeMaxChars = 6000

[socialV2.media]
maxBytes = 8388608
maxPixels = 64000000
maxCount = 5

[socialV2.media.gif]
enabled = true
frames = 9
cellPx = 224
onlyAnimated = true

[webSearch]
provider = "auto"
apiKey = ""
apiKeyEnv = "DEEPSEEK_API_KEY"
baseURL = ""
model = "deepseek-v4-flash"
maxUses = 5
maxTokens = 4096
maxResults = 8
timeoutMs = 35000
# ── 峰谷时段策略（按 DeepSeek 官方定价：北京时间周一至周五 09:00-12:00、14:00-18:00 为高峰，
#    其余时段（含周末/法定节假日全天）为空闲；空闲价 = 高峰价的一半。
#    注意：法定节假日无法用 days 表达，会按工作日高峰计费，届时可临时把对应两段删掉。
#    覆盖字段可省略（= 用全局默认）；跨零点时段按"开始日"归属。
[[periods]]
name = "高峰-上午"
days = ["mon", "tue", "wed", "thu", "fri"]
start = "09:00"
end = "12:00"
replyProbability = 0.15
reasoningEffort = "medium"
proactive = false
sendMaxPerHour = 100

# 分群限额（可选）：给名单内的群追加单独限制；未列出的群只受上面的合计限额约束。
groupLimits = [ { groups = ["123456789"], perMinute = 3, perHour = 30 } ]

[[periods]]
name = "高峰-下午"
days = ["mon", "tue", "wed", "thu", "fri"]
start = "14:00"
end = "18:00"
replyProbability = 0.15
reasoningEffort = "medium"
proactive = false
sendMaxPerHour = 100

[[periods]]
name = "空闲-夜间"
start = "18:00"
end = "09:00"
replyProbability = 0.3
reasoningEffort = "high"
proactive = true
sendMaxPerHour = 600

[[periods]]
name = "空闲-白天"
start = "09:00"
end = "18:00"
replyProbability = 0.3
reasoningEffort = "high"
proactive = true
sendMaxPerHour = 600
